Create API Key
Create a new API key for the configured service
---
tags:
  - 'api-key'
security:
  - Bearer: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: Human-readable name for the API key
          description:
            type: string
            description: Optional description
          expires_at:
            type: string
            format: date-time
            description: Optional expiration date (ISO 8601 format)
responses:
  201:
    description: API key created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            description:
              type: string
            service:
              type: string
            api_key:
              type: string
              description: The actual API key (only returned once during creation)
            created_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
  400:
    description: Bad request (e.g., name is required)
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
  500:
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string


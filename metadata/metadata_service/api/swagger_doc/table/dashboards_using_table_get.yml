Gets Dashboards that is using this table
---
security:
  - BearerAuth: []
tags:
  - 'table'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: id
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'hive://gold.test_schema/test_table2'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'List of dashboards that table is used'
    content:
      application/json:
        schema:
          type: object
          properties:
            dashboards:
              type: array
              items:
                $ref: '#/components/schemas/DashboardSummary'
  404:
    description: 'Table not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Adds tag on a table
---
security:
  - BearerAuth: []
tags:
  - 'table'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/ResourceIdParameter'
  - $ref: '#/components/parameters/TagNameParameter'
  - $ref: '#/components/parameters/TagTypeParameter'
requestBody:
  $ref: '#/components/requestBodies/PublisherRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'The tag was added successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'Table not found, or tag has type badge and is not whitelisted'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

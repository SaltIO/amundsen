Delete a table and all its child resources
Delete a table and all its child resources (columns, descriptions, stats, etc.)
---
security:
  - BearerAuth: []
tags:
  - 'table'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/TableUriParameter'
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          published_tag:
            type: string
            description: Published tag for the deletion
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    $ref: '#/components/responses/EmptyResponse'
  404:
    description: 'Table not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'


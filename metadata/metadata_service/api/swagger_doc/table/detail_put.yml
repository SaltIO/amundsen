Creates or Updates a Table.  This can include columns, decriptions, badges, tags, and many other related entities.
This does a merge, if the entities exist.  It will overwrite what is provided, and leave what is not provided.
---
security:
  - BearerAuth: []
tags:
  - 'table'
requestBody:
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/TableDetail'
        description: 'Table Details'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'Existing table found and updated'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  201:
    description: 'New table created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  400:
    description: 'Bad Request'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Creates or Updates a Table.  This can include columns, decriptions, badges, tags, and many other related entities.
This does a merge, if the entities exist.  It will overwrite what is provided, and leave what is not provided.
---
security:
  - BearerAuth: []
tags:
  - 'table'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
requestBody:
  $ref: '#/components/requestBodies/TableDetailPutRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Existing table found and updated'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  201:
    description: 'New table created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  400:
    description: 'Bad Request'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

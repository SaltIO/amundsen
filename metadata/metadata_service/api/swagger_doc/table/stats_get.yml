Gets table stats using table_uri
---
security:
  - BearerAuth: []
tags:
  - 'table'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/TableUriParameter'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Table Stats'
    content:
      application/json:
        schema:
          type: object
          properties:
            table_stats:
              type: array
              description: 'A list of table stats'
              items:
                $ref: '#/components/schemas/StatFields'
  404:
    description: 'Table uri not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal error fetching the table stats'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Gets information about popular resources (tables, dashboards)
---
security:
  - BearerAuth: []
tags:
  - 'popular_resources'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - in: query
    name: limit
    required: false
    type: integer
    schema:
      type: integer
      default: 10
  - in: query
    name: types
    required: false
    type: string
    schema:
      type: string
      default: table
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'Popular Resources'
    content:
      application/json:
        schema:
          type: object
          properties:
            table:
              type: array
              items:
                $ref: '#/components/schemas/TableSummary'
            dashboard:
              type: array
              items:
                $ref: '#/components/schemas/DashboardSummary'

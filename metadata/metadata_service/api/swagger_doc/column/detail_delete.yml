Delete a column and all its directly connected orphaned nodes
Delete a column and all its directly connected orphaned nodes (descriptions, stats, programmatic descriptions). Does NOT delete nodes that may have other relationships (badges, type_metadata, lineage, etc.)
---
security:
  - BearerAuth: []
tags:
  - 'column'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: column_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'Column URI (format: table_uri/column_name)'
    example: 'database://cluster.schema/table_name/column_name'
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          published_tag:
            type: string
            description: Published tag for the deletion
          table_name:
            type: string
            description: Table name (alternative to column_uri in path, requires database_name, cluster_name, schema_name)
          column_name:
            type: string
            description: Column name (alternative to column_uri in path, requires table_name)
          database_name:
            type: string
            description: Database name (required if using table_name)
          cluster_name:
            type: string
            description: Cluster name (required if using table_name)
          schema_name:
            type: string
            description: Schema name (required if using table_name)
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    $ref: '#/components/responses/EmptyResponse'
  404:
    description: 'Column not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  400:
    description: 'Bad request (missing required parameters)'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'


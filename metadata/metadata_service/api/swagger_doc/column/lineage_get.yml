Get lineage
---
security:
  - BearerAuth: []
tags:
  - 'lineage'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/TableUriParameter'
  - name: column_name
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'test_col_name'
  - name: direction
    in: query
    type: string
    schema:
      type: string
    required: false
    example: 'upstream'
  - name: depth
    in: query
    type: integer
    schema:
      type: integer
    required: false
    example: 0
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Lineage for requested direction and depth'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Lineage'

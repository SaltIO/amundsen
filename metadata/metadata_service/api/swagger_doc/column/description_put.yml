Updates column description (passed as a request body)
---
security:
  - BearerAuth: []
tags:
  - 'column'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/TableUriParameter'
  - name: column_name
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'col2'
requestBody:
  $ref: '#/components/requestBodies/DescriptionPutRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Empty json response'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmptyResponse'
  404:
    description: 'Table uri with this column not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

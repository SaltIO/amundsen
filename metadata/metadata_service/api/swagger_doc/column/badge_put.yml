Add badge to a resource
---
security:
  - BearerAuth: []
tags:
  - 'column'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: table_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'hive://gold.test_schema/test_table1'
  - name: badge
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'beta'
  - name: category
    in: query
    type: string
    schema:
      type: string
    required: true
    example: 'table_status'
  - name: column_name
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'beta'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'The badge was added successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'Table not found, or badge is not whitelisted'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Gets Snowflake Table Shares
---
security:
  - BearerAuth: []
tags:
  - 'snowflake'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: table_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'dynamo://gold.test_schema/test_table2'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'Snowflake Table Shares'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/SnowflakeTableShare'
  404:
    description: 'Snowflake Table Shares not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

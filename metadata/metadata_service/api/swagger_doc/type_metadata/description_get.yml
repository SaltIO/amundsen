Gets type_metadata description using table_uri, column_name, and type_metadata_key
---
security:
  - BearerAuth: []
tags:
  - 'type_metadata'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: type_metadata_key
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'dynamo://gold.test_schema/test_table2/col2/type/col2'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'TypeMetadata description'
    content:
      application/json:
        schema:
          type: object
          properties:
            description:
              type: string
              example: 'Identifies a user'
  404:
    description: 'TypeMetadata not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal error fetching the TypeMetadata description'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

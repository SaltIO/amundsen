Updates type_metadata description (passed as a request body)
---
security:
  - BearerAuth: []
tags:
  - 'type_metadata'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: type_metadata_key
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'dynamo://gold.test_schema/test_table2/col2/type/col2'
requestBody:
  $ref: '#/components/requestBodies/DescriptionPutRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Empty json response'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmptyResponse'
  404:
    description: 'TypeMetadata not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

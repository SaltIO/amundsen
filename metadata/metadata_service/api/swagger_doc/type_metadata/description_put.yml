Updates type_metadata description (passed as a request body)
---
security:
  - BearerAuth: []
tags:
  - 'type_metadata'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: type_metadata_key
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'dynamo://gold.test_schema/test_table2/col2/type/col2'
requestBody:
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/DescriptionPut'
        description: 'TypeMetadata description'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'Empty json response'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/EmptyResponse'
  404:
    description: 'TypeMetadata not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Gets Cluster details by ID
---
security:
  - BearerAuth: []
tags:
  - 'cluster'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/ResourceIdQParameter'
responses:
  200:
    description: 'Cluster details'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Cluster'
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  400:
    description: 'Bad Request'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  404:
    description: 'Cluster not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'


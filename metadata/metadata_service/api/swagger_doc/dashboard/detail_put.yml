Creates or Updates a Dashboard.  This can include groups, queries, charts, tags, and many other related entities.
This does a merge, if the entities exist.  It will overwrite what is provided, and leave what is not provided.
---
security:
  - BearerAuth: []
tags:
  - 'dashboard'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
requestBody:
  $ref: '#/components/requestBodies/DashboardDetailPutRequest'
responses:
  400:
    $ref: '#/components/responses/ValidationErrorResponse'
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Existing dashboard found and updated'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  201:
    description: 'New dashboard created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

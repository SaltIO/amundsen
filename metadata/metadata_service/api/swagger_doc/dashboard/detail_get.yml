Gets dashboard details
---
security:
  - BearerAuth: []
tags:
  - 'dashboard'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: dashboard_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'mode_dashboard://gold.abcdefg/1234567'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Dashboard details'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/DashboardDetail'
  404:
    description: 'Dashboard not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

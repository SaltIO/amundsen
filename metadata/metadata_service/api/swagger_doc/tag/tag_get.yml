Get tags
---
security:
  - BearerAuth: []
tags:
  - 'tag'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'The tags and their usage'
    content:
      application/json:
        schema:
          type: object
          properties:
            tag_usages:
              type: array
              items:
                $ref: '#/components/schemas/TagUsage'

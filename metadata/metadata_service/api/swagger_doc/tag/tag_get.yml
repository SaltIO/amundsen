Get tags
---
security:
  - BearerAuth: []
tags:
  - 'tag'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'The tags and their usage'
    content:
      application/json:
        schema:
          type: object
          properties:
            tag_usages:
              type: array
              items:
                $ref: '#/components/schemas/TagUsage'

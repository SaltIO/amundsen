Gets a List of Database details
---
security:
  - BearerAuth: []
tags:
  - 'database'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
responses:
  200:
    description: 'List of Database details'
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Database'
  400:
    description: 'Bad Request'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'

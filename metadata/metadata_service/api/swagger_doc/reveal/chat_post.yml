Chat with AI
Sends a chat request to the AI and returns a response
---
security:
  - BearerAuth: []
tags:
  - 'reveal'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          messages:
            type: array
            description: 'Array of chat messages'
            items:
              type: object
              properties:
                role:
                  type: string
                  description: 'Role of the message sender (system, user, assistant)'
                  example: 'user'
                content:
                  type: string
                  description: 'Content of the message'
                  example: 'What tables have customer data?'
          function:
            type: object
            description: 'Optional function call configuration for structured output'
        required:
          - messages
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Chat response from AI'
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: object
              properties:
                role:
                  type: string
                content:
                  type: string
            finish_reason:
              type: string
  400:
    description: 'Bad request - missing required fields'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    $ref: '#/components/responses/InternalServerErrorResponse'

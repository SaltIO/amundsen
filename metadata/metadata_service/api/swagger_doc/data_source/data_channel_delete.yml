Delete a Data Channel
Deletes a data channel from a data provider
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: data_provider_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the parent data provider'
    example: 'data_provider://CMDRVL'
  - name: data_channel_key
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'Key of the data channel to delete'
    example: 'cmdrvl://reveal_api/api'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Data channel deleted successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'Data provider or data channel not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

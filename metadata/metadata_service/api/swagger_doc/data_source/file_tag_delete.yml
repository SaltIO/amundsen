Remove tag from File
Removes a tag association from a file
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: id
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the file'
    example: 'filesystem://text/file.txt'
  - $ref: '#/components/parameters/TagNameParameter'
  - $ref: '#/components/parameters/TagTypeParameter'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    $ref: '#/components/responses/EmptyResponse'
  404:
    description: 'File or tag not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

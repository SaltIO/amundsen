Add owner to File
Adds an owner to an existing file
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: file_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the file'
    example: 'filesystem://text/file.txt'
  - name: owner
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'Email or ID of the owner to add'
    example: 'owner@example.com'
requestBody:
  $ref: '#/components/requestBodies/PublisherRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    $ref: '#/components/responses/EmptyResponse'
  404:
    description: 'File not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

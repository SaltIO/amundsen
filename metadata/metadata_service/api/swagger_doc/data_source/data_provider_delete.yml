Delete a Data Provider
Deletes a data provider and cascades delete to its channels
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: data_provider_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the data provider to delete'
    example: 'data_provider://CMDRVL'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Data provider deleted successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'Data provider not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Creates or Updates a File.  This can include DataLocation, DataProvider, DataChannel, tags, descriptions, and other related entities.
This does a merge, if the entities exist.  It will overwrite what is provided, and leave what is not provided.
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
requestBody:
  $ref: '#/components/requestBodies/FilePutRequest'
responses:
  400:
    $ref: '#/components/responses/ValidationErrorResponse'
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Existing file found and updated'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  201:
    description: 'New file created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

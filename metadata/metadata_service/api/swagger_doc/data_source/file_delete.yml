Delete a File
Deletes a file from the catalog
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: file_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the file to delete'
    example: 'filesystem://text/file.txt'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'File deleted successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'File not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Create or update a Data Provider
Creates a new data provider or updates an existing one
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
requestBody:
  required: true
  content:
    application/json:
      schema:
        allOf:
          - $ref: '#/components/schemas/DataProviderFields'
          - $ref: '#/components/schemas/Publisher'
responses:
  400:
    $ref: '#/components/responses/ValidationErrorResponse'
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Data provider updated'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  201:
    description: 'Data provider created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/KeyStatus'
  404:
    description: 'Failed to create/update data provider'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

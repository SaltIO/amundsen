Add tag to Data Provider
Adds a tag to an existing data provider
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: id
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the data provider'
    example: 'data_provider://CMDRVL'
  - $ref: '#/components/parameters/TagNameParameter'
  - $ref: '#/components/parameters/TagTypeParameter'
requestBody:
  $ref: '#/components/requestBodies/PublisherRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    $ref: '#/components/responses/EmptyResponse'
  404:
    description: 'Data provider not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

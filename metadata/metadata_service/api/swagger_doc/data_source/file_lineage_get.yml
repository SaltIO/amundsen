Get File lineage
Retrieves the lineage (upstream and downstream) for a specific file
---
security:
  - BearerAuth: []
tags:
  - 'data_source'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: id
    in: path
    type: string
    schema:
      type: string
    required: true
    description: 'URI of the file'
    example: 'filesystem://text/file.txt'
  - name: direction
    in: query
    type: string
    schema:
      type: string
      enum: ['upstream', 'downstream', 'both']
    required: false
    default: 'both'
    description: 'Direction of lineage to retrieve'
  - name: depth
    in: query
    type: integer
    schema:
      type: integer
    required: false
    default: 1
    description: 'Depth of lineage traversal'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'File lineage'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Lineage'
  404:
    description: 'File not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

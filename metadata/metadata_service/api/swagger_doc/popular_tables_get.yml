    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Popular tables'
    content:
      application/json:
        schema:
          type: object
          properties:
            popular_tables:
              type: array
              items:
                $ref: '#/components/schemas/PopularTables'

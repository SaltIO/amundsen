Gets information about popular tables
---
security:
  - BearerAuth: []
tags:
  - 'popular_tables'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - in: query
    name: limit
    required: false
    type: integer
    schema:
      type: integer
      default: 10
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'Popular tables'
    content:
      application/json:
        schema:
          type: object
          properties:
            popular_tables:
              type: array
              items:
                $ref: '#/components/schemas/PopularTables'

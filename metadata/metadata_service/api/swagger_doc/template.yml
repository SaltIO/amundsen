openapi: '3.0.2'
info:
  title: 'CMD+RVL Metadata API'
  description: 'API to Manage your Metadata'
  version: '4.0.0'

components:

  parameters:
    AuthorizationHeaderParameter:
      name: Authorization
      in: header
      description: "Bearer token"
      required: true
      schema:
        type: string
        example: "Bearer your_token_here"
    TableUriParameter:
      name: table_uri
      in: path
      type: string
      schema:
        type: string
      required: true
      example: 'hive://gold.test_schema/test_table1'
    TableIdParameter:
      name: id
      in: path
      type: string
      schema:
        type: string
      required: true
      example: 'hive://gold.test_schema/test_table1'
    ResourceIdParameter:
      name: id
      in: path
      type: string
      schema:
        type: string
      required: true
      example: 'dynamo://gold.test_schema/test_table2'
    ResourceIdQParameter:
      name: id
      in: query
      type: string
      schema:
        type: string
      required: true
      example: 'dynamo://gold.test_schema/test_table2'
    BadgeNameParameter:
      name: badge
      in: path
      type: string
      schema:
        type: string
      required: true
      example: 'beta'
    BadgeCategoryParameter:
      name: category
      in: query
      type: string
      schema:
        type: string
      required: true
      example: 'column'
    TagNameParameter:
      name: tag
      in: path
      type: string
      schema:
        type: string
      required: true
      example: 'tag3'
    TagTypeParameter:
      name: tag_type
      in: query
      type: string
      schema:
        type: string
      required: false
      default: 'default'
      example: 'badge'

  requestBodies:
    PublisherRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Publisher'
    EmptyRequest:
      required: false
      content:
        application/json:
          schema:
            type: object  # ✅ Allows an empty JSON body
    TableDetailPutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TableDetailPut'
    DashboardDetailPutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DashboardDetailPut'
    FilePutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FilePut'
    LineagePutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LineagePut'
    DescriptionPutRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DescriptionPut'
    StatsPutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatsPut'
    UpdateFrequencyPutRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateFrequencyPut'
    UserDetailPutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDetailPut'

  responses:
    AuthTokenResponse:
      description: 'The auth token'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthToken'
            description: 'Auth Token Response'
    AuthTokenInvalidResponse:
      description: 'Auth Token Missing, Invalid or Expired'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            description: 'Auth Token Invalid Response'
    ValidationErrorResponse:
      description: 'Payload Validation Error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            description: 'Auth Token Invalid Response'
    ReadOnlyModeResponse:
      description: 'API is in read-only mode. Write operations are not allowed.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            description: 'Read-only Mode Response'
    ResourceDescriptionResponse:
      description: 'Resource description'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Description'
            description: 'Resource description'
    EmptyResponse:
      description: 'Empty response'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyResponse'

    ResourceNotFoundResponse:
      description: 'Resource not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerErrorResponse:
      description: 'Internal server error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthcheckResponse:
      type: object
      properties:
        status:
          type: string
          description: The status of the API, values will be 'ok' or 'fail'
        checks:
          type: object
          description: An arbitrary dictionary representing the healthchecks that have run
          example:
            $ref: '#/detailedExamples/healthcheck'
    AuthToken:
      type: object
      required:
        - access_token
        - expires_in
        - token_type
      properties:
        access_token:
          description: 'The Auth Token'
          type: string
        expires_in:
          description: 'The Auth Token expiration in seconds'
          type: integer
        token_type:
          description: 'The type of token (ie Bearer)'
          type: string
    AuthTokenClient:
      type: object
      required:
        - client_id
        - client_secret
      properties:
        client_id:
          description: 'The Auth Client ID as provided by your Admin'
          type: string
        client_secret:
          description: 'The Auth Client Secret as provided by your Admin'
          type: string
    TableFields:
      type: object
      # required:
      #   - description
      properties:
        database:
          type: string
          example: "snowflake"
        cluster:
          type: string
          example: "client"
        schema:
          type: string
          example: "public"
        name:
          type: string
          example: "gold_table"
        key:
          type: string
          example: "snowflake://client.public/gold_table"
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'
        # table_readers:
        #   type: array
        #   items:
        #     $ref: '#/components/schemas/Reader'
        tags:
          type: string
          example: "Gold Table"
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnFields'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/UserFields'
        watermarks:
          type: array
          items:
            $ref: '#/components/schemas/WatermarkFields'
        watermarks:
          type: array
          items:
            $ref: '#/components/schemas/WatermarkFields'
        table_apps:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationFields'
        last_updated_timestamp:
          type: integer
          example: "123456789"
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceFields'
        is_view:
          type: boolean
          example: "True"
        # programmatic_descriptions:
        #   type: array
        #   items:
        #     $ref: '#/components/schemas/ProgrammaticDescriptionFields'
        update_frequency:
          type: string
          example: "quarterly"
    DashboardGroupFields:
      type: object
      # required:
      #   - description
      properties:
        key:
          type: string
          example: "count_dashboard://client.group"
        product:
          type: string
          example: "count"
        cluster:
          type: string
          example: "client"
        dashboard_group_name:
          type: string
          example: "dashboard_group"
        url:
          type: string
          example: "http://cmdrvl.com"
        description:
          type: string
          example: "Dashboards are neat"
    DashboardChartFields:
      type: object
      # required:
      #   - description
      properties:
        key:
          type: string
          example: "count_dashboard://client.group/dashboard/query/query_name/chart/chart_name"
        product:
          type: string
          example: "count"
        cluster:
          type: string
          example: "client"
        dashboard_group_name:
          type: string
          example: "dashboard_group"
        dashboard_name:
          type: string
          example: "dashboard_name"
        dashboard_query_name:
          type: string
          example: "dashboard_query_name"
        chart_name:
          type: string
          example: "chart_name"
        chart_type:
          type: string
          example: "chart_type"
        chart_url:
          type: string
          example: "chart_url"
    DashboardQueryExecutionFields:
      type: object
      # required:
      #   - description
      properties:
        key:
          type: string
          example: "count_dashboard://client.group/dashboard/query/query_name/execution/_last_successful_execution"
        product:
          type: string
          example: "count"
        cluster:
          type: string
          example: "client"
        dashboard_group_name:
          type: string
          example: "dashboard_group"
        dashboard_name:
          type: string
          example: "dashboard_name"
        dashboard_query_name:
          type: string
          example: "dashboard_query_name"
        query_execution_timestamp:
          type: int
          example: 123456789
        query_execution_state:
          type: string
          example: "query_execution_state"
        query_execution_name:
          type: string
          example: "_last_execution"
    DashboardQueryFields:
      type: object
      # required:
      #   - description
      properties:
        key:
          type: string
          example: "count_dashboard://client.group/dashboard/query/query_name"
        product:
          type: string
          example: "count"
        cluster:
          type: string
          example: "client"
        dashboard_group_name:
          type: string
          example: "dashboard_group"
        dashboard_name:
          type: string
          example: "dashboard_name"
        dashboard_query_name:
          type: string
          example: "dashboard_query_name"
        query_statement:
          type: string
          example: "SELECT * FROM table;"
        query_url:
          type: string
          example: "https://github.com"
        charts:
          type: array
          items:
            $ref: '#/components/schemas/DashboardChartFields'
        last_execution:
          ref: '#/components/schemas/DashboardQueryExecutionFields'
    DashboardLastModifiedTimestampFields:
      type: object
      # required:
      #   - description
      properties:
        key:
          type: string
          example: "count_dashboard://client.group/dashboard/_last_modified_timestamp"
        product:
          type: string
          example: "count"
        cluster:
          type: string
          example: "client"
        dashboard_group_name:
          type: string
          example: "dashboard_group"
        dashboard_name:
          type: string
          example: "dashboard"
        last_modified_timestamp:
          type: int
          example: 123456789
    DashboardFields:
      type: object
      # required:
      #   - description
      properties:
        key:
          type: string
          example: "count_dashboard://client.group/dashboard"
        product:
          type: string
          example: "count"
        cluster:
          type: string
          example: "client"
        dashboard_group_name:
          type: string
          example: "dashboard_group"
        dashboard_name:
          type: string
          example: "dashboard"
        url:
          type: string
          example: "http://cmdrvl.com"
        description:
          type: string
          example: "Dashboards are neat"
        created_timestamp:
          type: int
          example: 123456789
        tags:
          type: array
          items:
            type: string
        owners:
          type: array
          items:
            type: string
        dashboard_group:
          $ref: '#/components/schemas/DashboardGroupFields'
        dashboard_queries:
          type: array
          items:
            $ref: '#/components/schemas/DashboardQueryFields'
        dashboard_last_modified_timestamp:
          $ref: '#/components/schemas/DashboardLastModifiedTimestampFields'
    FileFields:
      type: object
      properties:
        key:
          type: string
          example: "filesystem"
        name:
          type: string
          example: "test.txt"
        description:
          type: string
          example: "This is a text text file"
        type:
          type: string
          example: "text"
        path:
          type: string
          example: "/path/to/file"
        is_directory:
          type: boolean
          example: false
        dashboard_location:
          "oneOf": [
                { "$ref": "#/components/schemas/DataLocationFields" },
                { "$ref": "#/components/schemas/AwsS3DataLocationFields" },
                { "$ref": "#/components/schemas/FilesystemDataLocationFields" }
            ]
        dashboard_provider:
          $ref: '#/components/schemas/DataProviderFields'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagFields'
    DataProviderFields:
      type: object
      properties:
        key:
          type: string
          example: "data_provider://CMDRVL"
        name:
          type: string
          example: "CMDRVL"
        website:
          type: string
          example: "https://cmdrvl.com"
        desc:
          type: string
          example: "This is a data provider"
        data_channels:
          type: array
          items:
            $ref: '#/components/schemas/DataChannelFields'
      required:
        - name
    DataChannelFields:
      type: object
      properties:
        key:
          type: string
          example: "cmdrvl://reveal_api/api"
        name:
          type: string
          example: "reveal_api"
        type:
          type: string
          enum: ["data_feed", "data_share", "api", "sftp"]
        url:
          type: string
          example: "https://cmdrvl.com"
        description:
          type: string
          example: "This is a data channel"
        license:
          type: string
          enum: ["Proprietary License", "Public Domain Dedication", "Creative Commons License By Attribution", "Creative Commons License By Attribution-ShareAlike", "Creative Commons License By Attribution-NoDerivatives", "Creative Commons License By Attribution-NonCommercial", "Open Data Commons Attribution License", "Open Data Commons Open Database License", "GNU General Public License", "MIT License", "Apache License", "BSD License"]
      required:
        - name
        - type
    DataLocationFields:
      type: object
      properties:
        key:
          type: string
          example: "filesystem://networkfilesystem"
        name:
          type: string
          example: "NetworkFilesystem"
        type:
          type: string
          example: "filesystem"
      required:
        - name
        - type
    AwsS3DataLocationFields:
      allOf:
        - $ref: '#/components/schemas/DataLocationFields'
        - type: object
          properties:
            type:
              type: string
              enum: ["aws_s3"]
              readOnly: true
            bucket:
              type: string
              example: "test_bucket"
          required:
            - bucket
    FilesystemDataLocationFields:
      allOf:
        - $ref: '#/components/schemas/DataLocationFields'
        - type: object
          properties:
            type:
              type: string
              enum: ["filesystem"]
              readOnly: true
            drive:
              type: string
              example: "C:"
          required:
            - bucket
    Description:
      type: object
      required:
        - description
      properties:
        description:
          type: string
          example: "Metadata Rocks!"
    DescriptionPut:
      type: object
      allOf:
        - $ref: '#/components/schemas/Description'
        - $ref: '#/components/schemas/Publisher'
    LineagePut:
      type: object
      properties:
        lineage:
          type: object
          description: 'Lineage'
          $ref: '#/components/schemas/LineageBase'
      allOf:
        - $ref: '#/components/schemas/Publisher'
    StatsPut:
      type: object
      properties:
        stats:
          type: array
          description: 'A list of stats'
          items:
            $ref: '#/components/schemas/StatFields'
      allOf:
        - $ref: '#/components/schemas/Publisher'
    TableDetailPut:
      type: object
      allOf:
        - $ref: '#/components/schemas/TableFields'
        - $ref: '#/components/schemas/Publisher'
    DashboardDetailPut:
      type: object
      allOf:
        - $ref: '#/components/schemas/DashboardFields'
        - $ref: '#/components/schemas/Publisher'
    FilePut:
      type: object
      allOf:
        - $ref: '#/components/schemas/FileFields'
        - $ref: '#/components/schemas/Publisher'
    UpdateFrequency:
      type: object
      required:
        - frequency
      properties:
        frequency:
          type: string
          example: "monthly"
    UpdateFrequencyPut:
      type: object
      allOf:
        - $ref: '#/components/schemas/UpdateFrequency'
        - $ref: '#/components/schemas/Publisher'
    Publisher:
      type: object
      properties:
        published_tag:
          type: string
          description: "A meaningful tag to describe the publishing mechanism."
          example: "api"
    PopularTables:
      type: object
      properties:
        database:
          description: 'Database name'
          type: string
        cluster:
          description: 'Cluster name'
          type: string
        schema:
          description: 'Schema name'
          type: string
        name:
          description: 'Table name'
          type: string
        description:
          description: 'Table description'
          type: string
        schema_description:
          description: 'Schema description'
          type: string
    TableSummary:
      type: object
      properties:
        database:
          description: 'Database name'
          type: string
        cluster:
          description: 'Cluster name'
          type: string
        schema:
          description: 'Schema name'
          type: string
        table_name:
          description: 'Table name'
          type: string
        table_description:
          description: 'Table description'
          type: string
    Tag:
      type: object
      properties:
        key:
          type: string
          description: 'Tag key'
          example: 'test'
        tag_type:
          type: string
          description: 'Tag type'
          example: 'default'
    TagFields:
      type: object
      properties:
        tag_type:
          type: string
          description: 'Tag type'
        tag_name:
          type: string
          description: 'Tag name'
    TagUsage:
      type: object
      properties:
        tag_name:
          type: string
          description: 'Tag name'
        tag_count:
          type: integer
          description: 'Count of times used'
    Badge:
        type: object
        properties:
          badge_name:
            type: string
            description: 'name of the badge'
          category:
            type: string
            description: 'category that badge belongs to'
    TableReaderFields:
      type: object
      properties:
        reader:
          $ref: '#/components/schemas/UserFields'
        read_count:
          type: integer
          description: 'Number of times the reader accessed the table'
    UserFields:
      type: object
      properties:
        email:
          type: string
          description: 'User email'
        first_name:
          type: string
          description: 'User first name'
        last_name:
          type: string
          description: 'User last name'
    UserDetail:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: 'User email'
        first_name:
          type: string
          description: 'User first name'
        last_name:
          type: string
          description: 'User last name'
        full_name:
          type: string
          description: 'User full name'
        is_active:
          type: boolean
          description: 'Is user active'
        profile_url:
          type: string
          description: 'User profile url'
        github_username:
          type: string
          description: 'User github'
        slack_id:
          type: string
          description: 'User slack'
        team_name:
          type: string
          description: 'User team name'
        employee_type:
          type: string
          description: 'User type'
        manager_fullname:
          type: string
          description: 'User manager full name'
        other_key_values:
          type: object
          additionalProperties:
            type: string
            description: 'Additional key value properties'
    UserDetailPut:
      type: object
      allOf:
        - $ref: '#/components/schemas/UserDetail'
        - $ref: '#/components/schemas/Publisher'
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        function:
          type: object
          description: 'Object representing the LLM Function Calls'
          $ref: '#/components/schemas/ChatFunction'
    ChatMessage:
      type: object
      properties:
        functions:
          type: object
          description: 'The role of the chat message: system, user, etc'
        content:
          type: string
          description: 'The message content'
    ChatFunction:
      type: object
      properties:
        functions:
          type: array
          description: 'The list of LLM function calls'
          $ref: '#/components/schemas/ChatFunctionCall'
        function_call:
          type: object
          description: 'The function to call'
          additionalProperties: true
    ColumnFields:
      type: object
      properties:
        name:
          type: string
          description: 'Column name'
        key:
          type: string
          description: 'Column key'
        description:
          type: string
          description: 'Column description'
        col_type:
          type: string
          description: 'Column type'
        sort_order:
          type: integer
          description: 'Sort order in the column'
        stats:
          type: array
          items:
            $ref: '#/components/schemas/StatFields'
        badges:
          type: array
          description: 'Badges associated with the column'
          items:
            $ref: '#/components/schemas/Badge'
        type_metadata:
          type: object
          description: 'Object representing the column type'
          $ref: '#/components/schemas/TypeMetadata'
    StatFields:
      type: object
      required:
        - stat_type
        - stat_val
        - start_epoch
        - end_epoch
      properties:
        stat_type:
          type: string
          description: 'Type of statistic'
          example: "max"
        stat_val:
          type: string
          description: 'Value of the statistic'
          example: "123"
        start_epoch:
          type: integer
          description: 'Start of the statistic (epoch)'
          example: 1234567
        end_epoch:
          type: integer
          example: 7654321
          description: 'End of the statistic (epoch)'
    TypeMetadata:
      type: object
      properties:
        kind:
          type: string
          description: 'The type kind (e.g. array, map, struct, etc)'
        name:
          type: string
          description: 'Type metadata name'
        key:
          type: string
          description: 'Type metadata key'
        description:
          type: string
          description: 'Type metadata description'
        data_type:
          type: string
          description: 'Representation of full type'
        sort_order:
          type: integer
          description: 'Sort order when there are multiple type metadata objects on one level'
        badges:
          type: array
          description: 'Badges associated with the type metadata'
          items:
            $ref: '#/components/schemas/Badge'
        children:
          type: array
          description: 'List of nested type metadata objects one level down'
          items:
            $ref: '#/components/schemas/TypeMetadata'
    WatermarkFields:
      type: object
      properties:
        watermark_type:
          type: string
          description: 'Watermark type'
        partition_key:
          type: string
          description: 'Partition key'
        partition_value:
          type: string
          description: 'Partition value'
        create_time:
          type: string
          description: 'Create time'
    ApplicationFields:
      type: object
      properties:
        application_url:
          type: string
          description: 'Application url'
        name:
          type: string
          description: 'Application name'
        id:
          type: string
          description: 'Application id'
        kind:
          type: string
          description: 'Whether the app is a producer or consumer'
        description:
          type: string
          description: 'Application description'
    SourceFields:
      type: object
      properties:
        source_type:
          type: string
          description: 'Source type'
        source:
          type: string
          description: 'Source name'
    KeyStatus:
      type: object
      required:
        - key
        - status
      properties:
        key:
          type: string
          description: 'The key of the resource created or updated'
        status:
          type: string
          description: 'The status of the resource action: created or updated'
    DatabaseDetail:
      type: object
      properties:
        key:
          type: string
          description: 'ID of the database'
        name:
          type: string
          description: 'Name of the database'
          example: 'snowflake://client'
    Database:
      type: object
      properties:
        key:
          type: string
          description: 'ID of the database'
          example: 'database://snowflake'
        name:
          type: string
          description: 'Name of the database'
          example: 'snowflake'
    Cluster:
      type: object
      properties:
        key:
          type: string
          description: 'ID of the cluster'
          example: 'snowflake://client'
        name:
          type: string
          description: 'Name of the cluster'
          example: 'client'
    Schema:
      type: object
      properties:
        key:
          type: string
          description: 'ID of the Schema'
          example: 'snowflake://client'
        name:
          type: string
          description: 'Name of the Schema'
          example: 'client'
    Table:
      type: object
      properties:
        key:
          type: string
          description: 'ID of the table'
        database:
          type: string
          description: 'Name of the database'
          example: 'dynamo'
        cluster:
          type: string
          description: 'Name of the cluster'
          example: 'gold'
        schema:
          type: string
          description: 'Name of the database schema'
        table_name:
          type: string
          description: 'Name of the table'
        table_description:
          type: string
          description: 'Table description'
        tags:
          type: array
          description: 'Tags attached to the table'
          items:
            $ref: '#/components/schemas/TagFields'
        badges:
          type: array
          description: 'Badges associated with the table'
          items:
            $ref: '#/components/schemas/Badge'
        table_readers:
          type: array
          description: 'Table readers'
          items:
            $ref: '#/components/schemas/TableReaderFields'
        owners:
          type: array
          description: 'Owners of the table'
          items:
            $ref: '#/components/schemas/UserFields'
        columns:
          type: array
          description: 'Columns of the table'
          items:
            $ref: '#/components/schemas/ColumnFields'
        watermarks:
          type: array
          description: 'Watermarks of the table'
          items:
            $ref: '#/components/schemas/WatermarkFields'
        table_writer:
          $ref: '#/components/schemas/ApplicationFields'
        table_apps:
          type: array
          description: 'Supersedes table_writer by allowing multiple applications which may be consumers or producers of a table'
          $ref: '#/components/schemas/ApplicationFields'
        last_updated_timestamp:
          type: integer
          description: 'Epoch timestamp of when it was last updated'
        source:
          $ref: '#/components/schemas/SourceFields'
        is_view:
          type: boolean
          description: 'If the table is a view'
    FeatureDetail:
      type: object
      properties:
        key:
          type: string
          description: 'Unique identifier for the feature'
          example: 'test_feature_group_name/test_feature_name/1.2.0'
        feature_name:
          type: string
          description: 'Name of the feature'
        version:
          type: string
          description: 'Version of the feature'
        feature_group:
          type: string
          description: 'Feature group the feature belongs to'
        entity:
          type: array
          description: 'Way of grouping features semantically by using nouns'
          items:
            type: string
        data_type:
          type: string
          description: 'Type of the dtaa in the feature'
        availability:
          type: array
          description: 'Services where feature is available'
          items:
            type: string
        description:
          type: string
          description: 'Feature description'
        owner_tags:
          type: array
          description: 'Tags specified programmatically'
          items:
            $ref: '#/components/schemas/TagFields'
        tags:
          type: array
          description: 'Tags attached to the feature'
          items:
            $ref: '#/components/schemas/TagFields'
        badges:
          type: array
          description: 'Badges associated with the feature'
          items:
            $ref: '#/components/schemas/Badge'
        owners:
          type: array
          description: 'Owners of the feature'
          items:
            $ref: '#/components/schemas/UserFields'
        watermarks:
          type: array
          description: 'Watermarks of the feature'
          items:
            $ref: '#/components/schemas/WatermarkFields'
        last_updated_timestamp:
          type: integer
          description: 'Epoch timestamp of when it was last updated'
    LineageBase:
      type: object
      properties:
        upstream_entities:
          type: array
          description: 'upstream entities from key'
          items:
            $ref: '#/components/schemas/LineageBaseItem'
        downstream_entities:
          type: array
          description: 'downstream entities from key'
          items:
            $ref: '#/components/schemas/LineageBaseItem'
    Lineage:
      type: object
      properties:
        key:
          type: string
          description: 'Key of entity to obtain lineage for'
          example: 'db://cluster.schema/test_table_1'
        depth:
          type: integer
          description: 'how many levels of lineage are shown'
          example: 1
        direction:
          type: string
          description: 'upstream, dowstream or both'
          example: 'downstream'
        upstream_entities:
          type: array
          description: 'upstream entities from key'
          items:
            $ref: '#/components/schemas/LineageItem'
        downstream_entities:
          type: array
          description: 'downstream entities from key'
          items:
            $ref: '#/components/schemas/LineageItem'
    LineageBaseItem:
      type: object
      properties:
        key:
          type: string
          description: 'upstream or downstream resource key'
          example: 'db://cluster.schema/up_table_1'
    LineageItem:
      type: object
      properties:
        key:
          type: string
          description: 'upstream or downstream resource key'
          example: 'db://cluster.schema/up_table_1'
        level:
          type: integer
          description: 'distance up or downstream from requested'
          example: 2
        source:
          type: string
          description: 'data source the resouce is extracted from'
          example: 'hive'
        badges:
          type: array
          description: 'badges associated with resource'
          items:
            $ref: '#/components/schemas/Badge'
        usage:
          type: integer
          description: 'value to sort lineage results by'
          example: 541
    Neo4jDetail:
      type: object
      properties:
        neo4j_latest_timestamp:
          type: integer
          description: 'Last time at which neo4j was updated (epoch)'
          example: '1577836800'
    StatisticsDetail:
      type: object
      properties:
        number_of_tables:
          type: integer
          description: 'Total number of tables in the system'
          example: '1'
        number_of_documented_tables:
          type: integer
          description: 'Total number of tables that have description at the table level'
          example: '1'
        number_of_documented_cols:
          type: integer
          description: 'Number of columns that hold documentation'
          example: '1'
        number_of_owners:
          type: integer
          description: 'Number of users who have been assigned as owners for tables'
          example: '1'
        number_of_tables_with_owners:
          type: integer
          description: 'Number of tables that have at least one assigned owner'
          example: '1'
        number_of_documented_and_owned_tables:
          type: integer
          description: 'Total number of tables that have both owner and description at the table level'
          example: '1'
    DashboardDetail:
      type: object
      properties:
        uri:
          type: string
          description: 'Unique identifier of the dashboard'
        cluster:
          type: string
          description: 'Cluster name'
        group_name:
          type: string
          description: 'Dashboard group name'
        group_url:
          type: string
          description: 'Dashboard group URL'
        product:
          type: string
          description: 'Dashboard product name'
          example: 'mode'
        name:
          type: string
          description: 'Dashboard name'
        url:
          type: string
          description: 'Dashboard URL'
        description:
          type: string
          description: 'Dashboard description'
        created_timestamp:
          type: integer
          description: 'Dashboard created timestamp in epoch'
        updated_timestamp:
          type: integer
          description: 'Dashboard updated timestamp in epoch'
        last_run_timestamp:
          type: integer
          description: 'Dashboard last run timestamp in epoch'
        owners:
          type: array
          description: 'Dashboard owners'
          items:
            $ref: '#/components/schemas/UserDetail'
        frequent_users:
          type: array
          description: 'Users frequently view dashboard'
          items:
            $ref: '#/components/schemas/UserDetail'
        chart_names:
          type: array
          description: 'Chart names associated with the Dashboard'
          items:
            type: string
        query_names:
          type: array
          description: '[DEPRECATED] Chart names associated with the Dashboard'
          items:
            type: string
        tables:
          type: array
          description: 'Tables that is used in Dashboard'
          items:
            $ref: '#/components/schemas/DashboardQuery'
        tags:
          type: array
          description: 'Tags tagged on Dashboard'
          items:
            $ref: '#/components/schemas/TagFields'
        badges:
            type: array
            description: 'Badges associated with the Dashboard'
            items:
              $ref: '#/components/schemas/Badge'
        recent_view_count:
          type: integer
          description: 'Dashboard recent view count. Not using explicit duration, as it is up to timely ingestion and timely removal of stale data'
          example: 1024
    DashboardSummary:
      type: object
      properties:
        uri:
          type: string
          description: 'Unique identifier of the dashboard'
        cluster:
          type: string
          description: 'Cluster name'
        group_name:
          type: string
          description: 'Dashboard group name'
        group_url:
          type: string
          description: 'Dashboard group URL'
        product:
          type: string
          description: 'Dashboard product name'
          example: 'mode'
        name:
          type: string
          description: 'Dashboard name'
        url:
          type: string
          description: 'Dashboard URL'
        description:
          type: string
          description: 'Dashboard description'
        last_successful_run_timestamp:
          type: integer
          description: 'Dashboard last run timestamp in epoch'
    DashboardQuery:
      type: object
      properties:
        query_name:
          type: string
          description: 'Name of the query'
        query_url:
          type: string
          description: 'URL of the query'
        query_text:
          type: string
          description: 'Query statement text'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: 'A simple description of what went wrong'
          example: 'An Exception encountered while processing your request'
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          description: 'A simple message to give additional information about the result of the request'
          example: 'Resource was created successfully'
    EmptyResponse:
      type: object
      properties: {}
    SnowflakeTableShare:
      type: object
      properties:
        owner_account:
          type: string
          description: 'The account name of the owner of the share'
        share_name:
          type: string
          description: 'The name of the share'


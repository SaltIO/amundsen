Adds tag on a feature
---
security:
  - BearerAuth: []
tags:
  - 'feature'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/ResourceIdParameter'
  - $ref: '#/components/parameters/TagNameParameter'
  - $ref: '#/components/parameters/TagTypeParameter'
requestBody:
  $ref: '#/components/parameters/EmptyRequest'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'The tag was added successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'Feature not found, or tag has type badge and is not whitelisted'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

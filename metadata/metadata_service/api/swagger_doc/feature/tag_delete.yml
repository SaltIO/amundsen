Delete tags of a feature
---
security:
  - BearerAuth: []
tags:
  - 'feature'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - $ref: '#/components/parameters/ResourceIdParameter'
  - $ref: '#/components/parameters/TagNameParameter'
  - $ref: '#/components/parameters/TagTypeParameter'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'The tag was deleted successfully'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/MessageResponse'
  404:
    description: 'Feature or tag not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

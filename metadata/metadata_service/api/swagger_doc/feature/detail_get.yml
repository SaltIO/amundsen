Gets feature details
---
security:
  - BearerAuth: []
tags:
  - 'feature'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: feature_uri
    in: path
    type: string
    schema:
      type: string
    required: true
    example: 'test_feature_group_name/test_feature_name/1.2.0'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Feature details'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/FeatureDetail'
  404:
    description: 'Feature not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Gets system information for neo4j
---
security:
  - BearerAuth: []
tags:
  - 'neo4j'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  200:
    description: 'Neo4j system information'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Neo4jDetail'
  204:
    description: 'Neo4j was not updated/indexed'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

Gets system information for neo4j
---
security:
  - BearerAuth: []
tags:
  - 'neo4j'
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'Neo4j system information'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/Neo4jDetail'
  204:
    description: 'Neo4j was not updated/indexed'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

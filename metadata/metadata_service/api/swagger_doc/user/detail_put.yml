Create or update a user
---
security:
  - BearerAuth: []
tags:
  - 'user'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
requestBody:
  $ref: '#/components/requestBodies/UserDetailPutRequest'
responses:
  401:
    $ref: '#/components/responses/AuthTokenInvalidResponse'
  403:
    $ref: '#/components/responses/ReadOnlyModeResponse'
  200:
    description: 'Existing user found and updated'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UserDetail'
  201:
    description: 'New user created'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/UserDetail'
  400:
    description: 'Bad Request'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'

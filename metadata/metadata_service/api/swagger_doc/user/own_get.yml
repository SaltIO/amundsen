Delete the user owner information
---
security:
  - BearerAuth: []
tags:
  - 'user'
parameters:
  - $ref: '#/components/parameters/AuthorizationHeaderParameter'
  - name: user_id
    in: path
    example: 'roald9@example.org'
    type: string
    schema:
      type: string
    required: true
responses:
  401:
    description: 'Auth Token Missing, Invalid or Expired'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  200:
    description: 'List of tables the user has owned'
    content:
      application/json:
        schema:
          type: object
          properties:
            table:
              type: array
              items:
                $ref: '#/components/schemas/PopularTables'
            dashboard:
              type: array
              items:
                $ref: '#/components/schemas/DashboardSummary'
  404:
    description: 'User not found'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
  500:
    description: 'Internal server error'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/ErrorResponse'
